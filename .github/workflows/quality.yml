name: Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect matrix-relevant changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            run_matrix:
              - 'app-v*.js'
              - 'tests/**'
              - 'functions/**'
              - 'scripts/release-smoke.sh'

      - name: Setup Node.js
        if: steps.changes.outputs.run_matrix == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run critical test matrix
        if: steps.changes.outputs.run_matrix == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node tests/google-classroom-integration.test.mjs
          node tests/rph-differentiated-pbd-preview.test.mjs
          node tests/rph-exact-session-differentiation-export.test.mjs
          node tests/rph-exact-session-gold-standard.test.mjs
          node tests/rph-export-parity.test.mjs
          node tests/rph-flexible-date-routing.test.mjs
          node tests/lessonmap-live-verify-gate.test.mjs
          node tests/rph-generation-ui.test.mjs
          node tests/rph-bm-year1-source-flow-v2.test.mjs
          node tests/rph-bm-year1-exact-session-variation.test.mjs
          node tests/rph-preview-ag-format.test.mjs
          node tests/rph-approved-scope-guard.test.mjs
          node tests/cloudflare-r2-source-files.test.mjs
          node tests/rph-docx-table-format.test.mjs
          node tests/all-subject-timetable-session-policy.test.mjs

      - name: Skip note (no runtime-impact changes)
        if: steps.changes.outputs.run_matrix != 'true'
        run: echo "No runtime-impact paths changed; critical matrix skipped by design."
